openapi: 3.1.0

info:
  title: Viva Wallet ISV Partner API
  version: 1.3.0
  description: |
    SDK PHP `qrcommunication/viva-isv-sdk` pour l'API **Viva Wallet ISV Partner**.

    Ce SDK couvre l'ensemble des opérations ISV : comptes connectés, ordres Smart Checkout avec commission,
    transactions via Composite Auth, Cloud Terminal POS, transferts marketplace et webhooks.

    ---

    ## Authentification

    Le SDK gère **3 mecanismes d'authentification** distincts :

    | Type | Methode | Usage |
    |------|---------|-------|
    | **ISV OAuth2** | Bearer token (`client_credentials`) | New API (comptes, ordres, terminaux, transferts, marketplace) |
    | **ISV Basic Auth** | `merchantId:apiKey` | Legacy API (propre compte) |
    | **Composite Basic Auth** | `resellerId:connectedMerchantId / resellerApiKey` | Legacy API (marchands connectes) |

    ### Composite Basic Auth (NON DOCUMENTE par Viva Wallet)

    Ce mecanisme a ete decouvert empiriquement lors de la certification ISV.
    Il est **obligatoire** pour toutes les operations sur les transactions des marchands connectes.

    ```
    Username: {ResellerID}:{ConnectedMerchantID}   (deux UUIDs separes par :)
    Password: {ResellerAPIKey}
    ```

    **Erreurs courantes sans Composite Auth :**
    - Bearer token sur Legacy API -> `401 Unauthorized`
    - ISV Basic Auth sur transaction marchand -> `"api action disabled"`
    - Connected merchant Basic Auth + IsvAmount -> `PaymentsRecurringIsvMissingReseller`

    ---

    ## Les 3 Hosts API

    | Host | Auth | Convention params | Endpoints |
    |------|------|-------------------|-----------|
    | `accounts.vivapayments.com` | Form POST (clientId:clientSecret) | -- | `/connect/token` uniquement |
    | `api.vivapayments.com` | Bearer token | **camelCase** | `/checkout/v2/isv/`, `/checkout/v2/orders/`, `/ecr/isv/v1/`, `/platforms/v1/` |
    | `www.vivapayments.com` | Basic Auth / Composite | **PascalCase** | `/api/orders`, `/api/transactions` |

    > **CRITIQUE** : ne jamais melanger les casses. Legacy = PascalCase, New = camelCase.

    ---

    ## Environnements

    | Environnement | Accounts URL | API URL | Legacy URL |
    |---------------|-------------|---------|------------|
    | Demo | `https://demo-accounts.vivapayments.com` | `https://demo-api.vivapayments.com` | `https://demo.vivapayments.com` |
    | Production | `https://accounts.vivapayments.com` | `https://api.vivapayments.com` | `https://www.vivapayments.com` |

    ---

    ## Carte de test (Demo)

    | Champ | Valeur |
    |-------|--------|
    | Numero | `4111111111111111` |
    | CVV | `111` |
    | Expiration | N'importe quelle date future |
    | 3DS password | `Secret!33` |

    ### Montants de declin (centimes)

    | Centimes | TransactionEventId | Description |
    |----------|-------------------|-------------|
    | `9951` | 10051 | Insufficient funds |
    | `9954` | 10054 | Expired card |
    | `9920` | 10200 | Stolen card |
    | `9957` | 10057 | Card not permitted |
    | `9961` | 10061 | Withdrawal limit |
    | `9906` | 10006 | General error |
    | `9914` | 10014 | Invalid card |

    ---

    ## Pieges decouverts lors de la certification ISV

    1. **Bearer token sur Legacy API** -> 401. L'API legacy n'accepte QUE Basic Auth.
    2. **ISV Basic Auth + transaction marchand connecte** -> `"api action disabled"`. Il faut le Composite Auth.
    3. **Connected merchant Basic Auth + IsvAmount** -> `PaymentsRecurringIsvMissingReseller`. Le contexte reseller est manquant.
    4. **`isvAmount > amount`** -> Rejete par l'API. Le SDK valide cote client (`InvalidArgumentException`).
    5. **`scope=isv` dans le token** -> `invalid_scope`. Ne PAS envoyer de scope explicite.
    6. **Preauth ISV via Cloud Terminal** -> `eventId: 6000` "ISV preauth transactions are not supported". Utiliser Smart Checkout.
    7. **Capture preauth** necessite "Allow recurring payments and pre-auth captures via API" active dans Settings > API Access.
    8. **Abort ECR** utilise GET (pas DELETE) avec `cashRegisterId` en query param.
    9. **Ordres ISV** : NE PAS envoyer `sourceCode` — le connected merchant utilise sa source par defaut.
