openapi: 3.1.0
info:
  title: Viva Wallet ISV SDK API
  version: 1.3.5
  description: |
    SDK PHP pour l'API **Viva Wallet ISV Partner** — comptes connectes, ordres ISV avec commission, transactions via Composite Auth, Cloud Terminal POS, transferts marketplace, Native Checkout ISV, webhooks ISV et parsing.

    ## Authentification

    Le SDK gere **4 schemas d'authentification** :

    | Type | Credentials | Format HTTP | Utilise pour |
    |------|-------------|-------------|-------------|
    | **ISV OAuth2 (Bearer)** | `clientId` + `clientSecret` | `Authorization: Bearer {token}` | New API — comptes, ordres ISV, terminaux, transferts, marketplace, native checkout, webhooks ISV |
    | **ISV Basic Auth** | `merchantId` + `apiKey` | `Authorization: Basic {merchantId:apiKey}` | Legacy API — propre compte ISV |
    | **Composite Basic Auth** | `resellerId` + `resellerApiKey` | `Authorization: Basic {compositeUsername:resellerApiKey}` | Legacy API — transactions des marchands connectes |
    | **ISV OAuth (token request)** | `clientId` + `clientSecret` | Form POST Basic Auth | `/connect/token` uniquement |

    ### Composite Basic Auth (NON DOCUMENTE par Viva Wallet)

    ```
    Username: {ResellerID}:{ConnectedMerchantID}   (deux UUIDs separes par :)
    Password: {ResellerAPIKey}
    ```

    Decouvert empiriquement lors de la certification ISV. La documentation officielle Viva Wallet ne specifie pas ce format.

    ## Les 3 Hosts API

    | Host | Auth | Convention | Endpoints |
    |------|------|------------|-----------|
    | `accounts.vivapayments.com` | Form POST | — | `/connect/token` |
    | `api.vivapayments.com` | Bearer token | **camelCase** | `/checkout/v2/isv/`, `/checkout/v2/orders/`, `/ecr/isv/v1/`, `/platforms/v1/`, `/isv/v1/`, `/nativecheckout/v2/isv/` |
    | `www.vivapayments.com` | Basic/Composite | **PascalCase** | `/api/orders`, `/api/transactions` |

    ## Environnements

    | Env | Accounts | API | Legacy |
    |-----|----------|-----|--------|
    | demo | `demo-accounts.vivapayments.com` | `demo-api.vivapayments.com` | `demo.vivapayments.com` |
    | production | `accounts.vivapayments.com` | `api.vivapayments.com` | `www.vivapayments.com` |
  contact:
    name: QrCommunication
    email: contact@qrcommunication.com
    url: https://qrcommunication.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.vivapayments.com
    description: Production (New API — Bearer token)
  - url: https://demo-api.vivapayments.com
    description: Demo/Sandbox (New API — Bearer token)
  - url: https://www.vivapayments.com
    description: Production (Legacy API — Basic/Composite Auth)
  - url: https://demo.vivapayments.com
    description: Demo/Sandbox (Legacy API — Basic/Composite Auth)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
      description: |
        ISV OAuth2 Bearer token obtenu via POST /connect/token sur accounts.vivapayments.com.
        Utilise pour toutes les operations New API (comptes, ordres ISV, terminaux, transferts, marketplace, native checkout, webhooks ISV).

    BasicAuth:
      type: http
      scheme: basic
      description: |
        ISV Merchant Basic Auth. Username = MerchantID, Password = APIKey.
        Utilise pour les operations Legacy API sur le propre compte ISV.

    CompositeBasicAuth:
      type: http
      scheme: basic
      description: |
        **Composite Basic Auth (NON DOCUMENTE par Viva Wallet).**

        Username = `{ResellerID}:{ConnectedMerchantID}` (deux UUIDs separes par `:`)
        Password = `{ResellerAPIKey}`

        Utilise pour les operations Legacy API sur les transactions des marchands connectes
        (capture preauth, recurring charge, cancel/refund, get transaction).

        Ce format a ete decouvert empiriquement lors de la certification ISV.

    IsvOAuth:
      type: oauth2
      description: ISV OAuth2 — token request via client_credentials
      flows:
        clientCredentials:
          tokenUrl: https://accounts.vivapayments.com/connect/token
          scopes: {}

  schemas:
    ConnectedAccountCreate:
      type: object
      required: [email, returnUrl]
      properties:
        email:
          type: string
          format: email
          description: Adresse email du marchand
        returnUrl:
          type: string
          format: uri
          description: URL de redirection apres onboarding KYB
        branding:
          type: object
          properties:
            partnerName:
              type: string
              description: Nom de la plateforme ISV
            logoUrl:
              type: string
              format: uri
              description: Logo de la plateforme ISV

    ConnectedAccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: UUID du compte connecte
        verificationStatus:
          type: string
          enum: [Pending, Verified, Active, Rejected]
          description: Statut de verification KYB
        merchantId:
          type: string
          format: uuid
          description: UUID marchand (disponible apres verification)
        invitation:
          type: object
          properties:
            redirectUrl:
              type: string
              format: uri
              description: URL d'onboarding KYB

    IsvAccountCreate:
      type: object
      required: [email, returnUrl]
      properties:
        email:
          type: string
          format: email
          description: Adresse email du marchand
        returnUrl:
          type: string
          format: uri
          description: URL de redirection apres onboarding
        branding:
          type: object
          properties:
            partnerName:
              type: string
              description: Nom de la plateforme ISV
            primaryColor:
              type: string
              description: Couleur hex pour le branding
            logoUrl:
              type: string
              format: uri
              description: Logo de la plateforme ISV

    IsvAccountResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        verificationStatus:
          type: string
          enum: [Pending, Verified, Active, Rejected]
        merchantId:
          type: string
          format: uuid
        invitation:
          type: object
          properties:
            redirectUrl:
              type: string
              format: uri

    IsvOrderCreate:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          description: Montant total en centimes
          example: 1500
        isvAmount:
          type: integer
          description: Commission ISV en centimes (doit etre <= amount)
          example: 100
        customerTrns:
          type: string
          description: Description visible par le client
        merchantTrns:
          type: string
          description: Reference interne
        allowRecurring:
          type: boolean
          default: false
          description: Tokeniser la carte pour recurring
        preauth:
          type: boolean
          default: false
          description: Pre-autorisation uniquement

    IsvOrderResponse:
      type: object
      properties:
        orderCode:
          type: integer
          description: Code de l'ordre Viva
          example: 1234567890

    TransactionDetails:
      type: object
      properties:
        TransactionId:
          type: string
          format: uuid
        StatusId:
          type: string
        Amount:
          type: number
          description: Montant en EUR
        Created:
          type: string
          format: date-time

    CaptureRequest:
      type: object
      required: [Amount]
      properties:
        Amount:
          type: integer
          description: Montant en centimes (PascalCase — Legacy API)
          example: 1500
        IsvAmount:
          type: integer
          description: Commission ISV en centimes
          example: 100

    RecurringRequest:
      type: object
      required: [Amount]
      properties:
        Amount:
          type: integer
          description: Montant en centimes
        IsvAmount:
          type: integer
          description: Commission ISV en centimes
        SourceCode:
          type: string
          description: Code source de paiement

    EcrSaleRequest:
      type: object
      required: [sessionId, terminalId, cashRegisterId, amount, currencyCode, isvDetails]
      properties:
        sessionId:
          type: string
          format: uuid
          description: UUID de la session (auto-genere si null)
        terminalId:
          type: integer
          description: Terminal TID
          example: 16014231
        cashRegisterId:
          type: string
          description: Identifiant ECR
          example: SDK-CR1
        amount:
          type: integer
          description: Montant en centimes
        currencyCode:
          type: integer
          description: ISO 4217 numerique (978 = EUR)
          default: 978
        merchantReference:
          type: string
          description: Reference interne
        tipAmount:
          type: integer
          default: 0
        isvDetails:
          type: object
          required: [amount, terminalMerchantId]
          properties:
            amount:
              type: integer
              description: Commission ISV en centimes
            terminalMerchantId:
              type: string
              format: uuid
              description: UUID du marchand proprietaire du terminal

    EcrSessionResponse:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        success:
          type: boolean
        eventId:
          type: integer
          description: Code evenement ECR (voir EcrEventId)
        transactionId:
          type: string
          format: uuid

    DeviceSearchRequest:
      type: object
      properties:
        merchantId:
          type: string
          format: uuid
        statusId:
          type: integer
        sourceCode:
          type: string

    TransferRequest:
      type: object
      required: [targetAccountId, amount]
      properties:
        targetAccountId:
          type: string
          format: uuid
          description: UUID du compte connecte cible
        amount:
          type: integer
          description: Montant en centimes
        sourceWalletId:
          type: string
          format: uuid
          description: UUID du wallet source (plateforme)
        transactionId:
          type: string
          format: uuid
          description: Lier a une transaction existante
        description:
          type: string
          description: Description du transfert

    TransferResponse:
      type: object
      properties:
        transferId:
          type: string
          format: uuid

    MarketplaceOrderCreate:
      type: object
      required: [amount, transfer]
      properties:
        amount:
          type: integer
          description: Montant total en centimes
        customerTrns:
          type: string
        merchantTrns:
          type: string
        sourceCode:
          type: string
        preauth:
          type: boolean
          default: false
        transfer:
          type: object
          required: [targetAccountId, amount]
          properties:
            targetAccountId:
              type: string
              format: uuid
              description: UUID du vendeur
            amount:
              type: integer
              description: Montant a transferer au vendeur en centimes

    NativeChargeTokenRequest:
      type: object
      required: [amount, paymentData, paymentMethodId]
      properties:
        amount:
          type: integer
          description: Montant en centimes
          example: 1500
        paymentData:
          type: string
          description: Donnees de paiement chiffrees depuis le SDK JS Viva
        paymentMethodId:
          type: integer
          default: 10
          description: ID methode de paiement (10 = carte)

    NativeChargeTokenResponse:
      type: object
      properties:
        chargeToken:
          type: string
          description: Token de charge a utiliser pour la transaction

    NativeTransactionRequest:
      type: object
      required: [chargeToken, amount]
      properties:
        chargeToken:
          type: string
          description: Token obtenu via createChargeToken
        amount:
          type: integer
          description: Montant en centimes
        isvAmount:
          type: integer
          description: Commission ISV en centimes
          default: 0
        currencyCode:
          type: integer
          default: 978
        merchantTrns:
          type: string
          description: Reference interne
        customerTrns:
          type: string
          description: Description client
        preauth:
          type: boolean
          default: false

    NativeTransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        statusId:
          type: string

    IsvWebhookCreate:
      type: object
      required: [url, eventType]
      properties:
        url:
          type: string
          format: uri
          description: URL de reception des notifications webhook
        eventType:
          type: string
          description: Type d'evenement a ecouter
        description:
          type: string
          description: Description du webhook

    IsvWebhookResponse:
      type: object
      properties:
        webhookId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        eventType:
          type: string
        description:
          type: string

    IsvWebhookUpdate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Nouvelle URL
        eventType:
          type: string
          description: Nouveau type d'evenement

    WebhookPayload:
      type: object
      properties:
        EventTypeId:
          type: integer
          description: ID du type d'evenement (voir table des 21 evenements)
          example: 1796
        EventData:
          type: object
          description: Donnees de l'evenement

    WebhookVerificationResponse:
      type: object
      properties:
        StatusCode:
          type: integer
          example: 0
        Key:
          type: string
          description: Cle de verification fournie par Viva

    ErrorResponse:
      type: object
      properties:
        ErrorCode:
          type: integer
        ErrorText:
          type: string
        message:
          type: string
        detail:
          type: string

    EcrEventId:
      type: integer
      description: |
        Codes evenements Cloud Terminal.

        | eventId | Nom | Description | `shouldPoll()` | `isTerminal()` |
        |---------|-----|-------------|----------------|-----------------|
        | 0 | SUCCESS | Transaction reussie | false | true |
        | 1003 | TERMINAL_TIMEOUT | Terminal timeout | false | true |
        | 1006 | DECLINED | Refusee par le serveur | false | true |
        | 1016 | ABORTED | Annulee (abort reussi) | false | true |
        | 1020 | INSUFFICIENT_FUNDS | Fonds insuffisants | false | true |
        | 1099 | GENERIC_ERROR | Erreur generique | false | true |
        | 1100 | IN_PROGRESS | En cours (poller) | **true** | false |
        | 6000 | BAD_PARAMS | Parametres incorrects | false | true |
      enum: [0, 1003, 1006, 1016, 1020, 1099, 1100, 6000]

    TransactionEventId:
      type: integer
      description: |
        Codes raison de declin.

        | EventId | Nom | Description | testAmount |
        |---------|-----|-------------|------------|
        | 10001 | REFER_TO_ISSUER | Refer to issuer | 0 |
        | 10003 | INVALID_MERCHANT | Invalid merchant | 0 |
        | 10004 | PICKUP_CARD | Pickup card | 0 |
        | 10005 | DO_NOT_HONOR | Do not honor | 0 |
        | 10006 | GENERAL_ERROR | General error | 9906 |
        | 10012 | INVALID_TRANSACTION | Invalid transaction | 0 |
        | 10013 | INVALID_AMOUNT | Invalid amount | 0 |
        | 10014 | INVALID_CARD | Invalid card | 9914 |
        | 10030 | FORMAT_ERROR | Format error | 0 |
        | 10041 | LOST_CARD | Lost card | 0 |
        | 10043 | STOLEN_CARD | Stolen card | 9920 |
        | 10051 | INSUFFICIENT_FUNDS | Insufficient funds | 9951 |
        | 10054 | EXPIRED_CARD | Expired card | 9954 |
        | 10055 | INCORRECT_PIN | Incorrect PIN | 0 |
        | 10057 | NOT_PERMITTED_CARDHOLDER | Card not permitted | 9957 |
        | 10058 | NOT_PERMITTED_TERMINAL | Not permitted terminal | 0 |
        | 10061 | WITHDRAWAL_LIMIT | Withdrawal limit exceeded | 9961 |
        | 10062 | RESTRICTED_CARD | Restricted card | 0 |
        | 10063 | SECURITY_VIOLATION | Security violation | 0 |
        | 10065 | ACTIVITY_LIMIT | Activity limit | 0 |
        | 10068 | LATE_RESPONSE | Late response | 0 |
        | 10070 | CALL_ISSUER | Call issuer | 0 |
        | 10075 | PIN_TRIES_EXCEEDED | PIN tries exceeded | 0 |
        | 10200 | UNMAPPED | Unmapped decline | 0 |
      enum: [10001, 10003, 10004, 10005, 10006, 10012, 10013, 10014, 10030, 10041, 10043, 10051, 10054, 10055, 10057, 10058, 10061, 10062, 10063, 10065, 10068, 10070, 10075, 10200]

tags:
  - name: ConnectedAccounts
    description: |
      Gestion des comptes marchands connectes via `/platforms/v1/accounts`.
      Auth : Bearer ISV OAuth (New API).
  - name: IsvAccounts
    description: |
      Gestion ISV-specifique des comptes via `/isv/v1/accounts`.
      Auth : Bearer ISV OAuth (New API).
  - name: IsvOrders
    description: |
      Ordres Smart Checkout avec commission ISV via `/checkout/v2/isv/orders`.
      Auth : Bearer ISV OAuth (New API).
  - name: IsvTransactions
    description: |
      Operations sur les transactions des marchands connectes via l'API Legacy.
      Auth : Composite Basic Auth.
      **Prerequis** : "Allow recurring payments and pre-auth captures via API" active.
  - name: EcrTerminals
    description: |
      Cloud Terminal API ISV — POS terminal via `/ecr/isv/v1/`.
      Auth : Bearer ISV OAuth (New API).
      **Preauth ISV via Cloud Terminal n'est PAS supporte** — utiliser Smart Checkout.
  - name: Transfers
    description: |
      Transferts de fonds vers les comptes connectes via `/platforms/v1/transfers`.
      Auth : Bearer ISV OAuth (New API).
  - name: MarketplaceOrders
    description: |
      Ordres marketplace avec transfert automatique via `/checkout/v2/orders/`.
      Auth : Bearer ISV OAuth (New API).
  - name: NativeCheckoutIsv
    description: |
      Native Checkout ISV — charge tokens + transactions server-to-server via `/nativecheckout/v2/isv/`.
      Auth : Bearer ISV OAuth (New API).

      **Flux :**
      1. Client collecte les donnees carte via SDK JS Viva -> paymentData chiffre
      2. Serveur cree un charge token via `createChargeToken()`
      3. Serveur execute la transaction via `createTransaction()`
  - name: IsvWebhooks
    description: |
      Gestion des webhooks ISV via `/isv/v1/webhooks`.
      Auth : Bearer ISV OAuth (New API).
      CRUD complet : creer, lister, modifier, supprimer.
  - name: Webhooks
    description: |
      Verification et parsing des evenements webhook Viva Wallet.
      Pas d'auth (cote serveur, reception des notifications).

      **21 evenements supportes :**

      | EventTypeId | Nom | Description |
      |-------------|-----|-------------|
      | 1796 | transaction.payment.created | Paiement effectue |
      | 1797 | transaction.refund.created | Remboursement effectue |
      | 1798 | transaction.payment.cancelled | Paiement annule |
      | 1799 | transaction.reversal.created | Reversal cree |
      | 1800 | transaction.preauth.created | Pre-autorisation creee |
      | 1801 | transaction.preauth.completed | Pre-autorisation capturee |
      | 1802 | transaction.preauth.cancelled | Pre-autorisation annulee |
      | 1810 | pos.session.created | Session POS creee |
      | 1811 | pos.session.failed | Session POS echouee |
      | 1812 | transaction.price.calculated | Prix calcule |
      | 1813 | transaction.failed | Transaction echouee |
      | 1819 | account.connected | Compte connecte |
      | 1820 | account.verification.status.changed | Statut verification change |
      | 1821 | account.transaction.created | Transaction compte creee |
      | 1822 | command.bank.transfer.created | Virement bancaire cree |
      | 1823 | command.bank.transfer.executed | Virement bancaire execute |
      | 1824 | transfer.created | Transfert cree |
      | 1825 | obligation.created | Obligation creee |
      | 1826 | obligation.captured | Obligation capturee |
      | 1827 | order.updated | Ordre mis a jour |
      | 1828 | sale.transactions.file | Fichier transactions vente |

paths:
  # ==================== ConnectedAccounts ====================

  /platforms/v1/accounts:
    post:
      tags: [ConnectedAccounts]
      summary: Creer un compte connecte
      operationId: createConnectedAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectedAccountCreate'
            example:
              email: merchant@example.com
              returnUrl: https://app.com/onboarding/complete
              branding:
                partnerName: Ma Plateforme
      responses:
        '200':
          description: Compte connecte cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountResponse'
              example:
                accountId: a1b2c3d4-0000-0000-0000-000000000000
                invitation:
                  redirectUrl: https://accounts.vivapayments.com/onboarding/...
        '400':
          description: Requete invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentification echouee

    get:
      tags: [ConnectedAccounts]
      summary: Lister tous les comptes connectes
      operationId: listConnectedAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste paginee des comptes connectes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectedAccountResponse'
        '401':
          description: Authentification echouee

  /platforms/v1/accounts/{accountId}:
    get:
      tags: [ConnectedAccounts]
      summary: Obtenir les details d'un compte connecte
      operationId: getConnectedAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du compte connecte
      responses:
        '200':
          description: Details du compte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountResponse'
        '404':
          description: Compte non trouve

    post:
      tags: [ConnectedAccounts]
      summary: Mettre a jour un compte connecte
      operationId: updateConnectedAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Attributs a mettre a jour
      responses:
        '200':
          description: Compte mis a jour
        '404':
          description: Compte non trouve

    delete:
      tags: [ConnectedAccounts]
      summary: Supprimer/deconnecter un compte connecte
      operationId: deleteConnectedAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compte deconnecte
        '404':
          description: Compte non trouve

  # ==================== IsvAccounts ====================

  /isv/v1/accounts:
    post:
      tags: [IsvAccounts]
      summary: Creer un compte ISV connecte
      operationId: createIsvAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvAccountCreate'
            example:
              email: merchant@example.com
              returnUrl: https://app.com/onboarding/complete
              branding:
                partnerName: Ma Plateforme
                primaryColor: '#0052FF'
      responses:
        '200':
          description: Compte ISV cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvAccountResponse'
        '400':
          description: Requete invalide
        '401':
          description: Authentification echouee

    get:
      tags: [IsvAccounts]
      summary: Lister tous les comptes ISV
      operationId: listIsvAccounts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des comptes ISV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IsvAccountResponse'
        '401':
          description: Authentification echouee

  /isv/v1/accounts/{accountId}:
    get:
      tags: [IsvAccounts]
      summary: Obtenir un compte ISV
      operationId: getIsvAccount
      security:
        - BearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details du compte ISV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvAccountResponse'
        '404':
          description: Compte non trouve

  # ==================== IsvOrders ====================

  /checkout/v2/isv/orders:
    post:
      tags: [IsvOrders]
      summary: Creer un ordre ISV (Smart Checkout)
      operationId: createIsvOrder
      security:
        - BearerAuth: []
      parameters:
        - name: MerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du marchand connecte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvOrderCreate'
            example:
              amount: 1500
              isvAmount: 100
              customerTrns: Consultation
              merchantTrns: session_123
      responses:
        '200':
          description: Ordre cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvOrderResponse'
              example:
                orderCode: 1234567890
        '400':
          description: |
            Requete invalide. Causes courantes :
            - `isvAmount > amount`
            - `sourceCode` envoye (NE PAS envoyer pour les ordres ISV)
        '401':
          description: Authentification echouee

  # ==================== IsvTransactions ====================

  /api/transactions/{transactionId}:
    get:
      tags: [IsvTransactions]
      summary: Obtenir les details d'une transaction
      operationId: getTransaction
      security:
        - CompositeBasicAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Details de la transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'
        '404':
          description: Transaction non trouvee

    post:
      tags: [IsvTransactions]
      summary: Capturer un preauth ou charger un recurring
      description: |
        **Capture preauth** : POST avec `Amount` (+ `IsvAmount` optionnel).
        **Recurring** : POST sur l'ID de la transaction initiale (token carte).

        Les parametres sont en **PascalCase** (convention Legacy API).
      operationId: captureOrRecurring
      security:
        - CompositeBasicAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID de la transaction (preauth ou initial pour recurring)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
            example:
              Amount: 1500
              IsvAmount: 100
      responses:
        '200':
          description: Transaction capturee/chargee
          content:
            application/json:
              schema:
                type: object
                properties:
                  ErrorCode:
                    type: integer
                    example: 0
                  ErrorText:
                    type: string
                  TransactionId:
                    type: string
                    format: uuid
        '400':
          description: |
            Erreur. Causes courantes :
            - `"api action disabled"` — mauvaise auth (utiliser Composite Auth)
            - `PaymentsRecurringIsvMissingReseller` — contexte reseller manquant

    delete:
      tags: [IsvTransactions]
      summary: Annuler/rembourser une transaction
      operationId: cancelTransaction
      security:
        - CompositeBasicAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: amount
          in: query
          required: false
          schema:
            type: integer
          description: Montant en centimes (null = remboursement total)
        - name: sourceCode
          in: query
          required: false
          schema:
            type: string
          description: Code source de paiement
      responses:
        '200':
          description: Transaction annulee/remboursee
        '400':
          description: Erreur

  /api/transactions:
    get:
      tags: [IsvTransactions]
      summary: Lister les transactions par date
      operationId: listTransactionsByDate
      security:
        - CompositeBasicAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date au format Y-m-d
      responses:
        '200':
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  Transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionDetails'

  # ==================== EcrTerminals ====================

  /ecr/isv/v1/devices:search:
    post:
      tags: [EcrTerminals]
      summary: Rechercher les terminaux POS
      operationId: searchDevices
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSearchRequest'
            example:
              merchantId: merchant-uuid
      responses:
        '200':
          description: Liste des terminaux
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /ecr/isv/v1/transactions:sale:
    post:
      tags: [EcrTerminals]
      summary: Creer une vente POS terminal
      description: |
        **ISV Preauth via Cloud Terminal n'est PAS supporte.** Le terminal retourne `eventId: 6000`.
        Utiliser Smart Checkout (`IsvOrders::create(preauth: true)`) a la place.
      operationId: createSale
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcrSaleRequest'
      responses:
        '200':
          description: Session de vente creee
        '400':
          description: Parametres incorrects

  /ecr/isv/v1/sessions/{sessionId}:
    get:
      tags: [EcrTerminals]
      summary: Obtenir le resultat d'une session
      operationId: getSession
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Etat de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcrSessionResponse'

  /ecr/isv/v1/sessions:
    get:
      tags: [EcrTerminals]
      summary: Lister les sessions par date
      operationId: listSessions
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EcrSessionResponse'

  /ecr/isv/v1/sessions:abort/{sessionId}:
    get:
      tags: [EcrTerminals]
      summary: Annuler une session en cours
      description: |
        **Utilise GET (pas DELETE)** avec `cashRegisterId` en query param.
        C'est une particularite de l'API Viva Wallet.
      operationId: abortSession
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cashRegisterId
          in: query
          required: true
          schema:
            type: string
          description: Identifiant ECR
      responses:
        '200':
          description: Session annulee

  # ==================== Transfers ====================

  /platforms/v1/transfers:
    post:
      tags: [Transfers]
      summary: Envoyer des fonds a un compte connecte
      operationId: sendTransfer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              targetAccountId: seller-uuid
              amount: 1000
              description: Paiement vendeur
      responses:
        '200':
          description: Transfert cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Requete invalide

  /platforms/v1/transfers/{transferId}:reverse:
    post:
      tags: [Transfers]
      summary: Annuler un transfert
      operationId: reverseTransfer
      security:
        - BearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  description: Montant en centimes (null = annulation totale)
      responses:
        '200':
          description: Transfert annule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'

  # ==================== MarketplaceOrders ====================

  /checkout/v2/orders/:
    post:
      tags: [MarketplaceOrders]
      summary: Creer un ordre marketplace avec transfert automatique
      operationId: createMarketplaceOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceOrderCreate'
            example:
              amount: 5000
              customerTrns: Achat marketplace
              transfer:
                targetAccountId: seller-uuid
                amount: 4000
      responses:
        '200':
          description: Ordre marketplace cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvOrderResponse'
        '400':
          description: Requete invalide

  /api/transactions/{transactionId}/marketplace:
    delete:
      tags: [MarketplaceOrders]
      summary: Annuler une transaction marketplace
      operationId: cancelMarketplaceTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: amount
          in: query
          schema:
            type: integer
          description: Montant en centimes (null = remboursement total)
        - name: reverseTransfers
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Annuler les transferts vendeur (defaut true)
        - name: refundPlatformFee
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Rembourser la commission plateforme (defaut false)
      responses:
        '200':
          description: Transaction annulee

  # ==================== NativeCheckoutIsv ====================

  /nativecheckout/v2/isv/chargetokens:
    post:
      tags: [NativeCheckoutIsv]
      summary: Generer un charge token ISV
      operationId: createChargeToken
      security:
        - BearerAuth: []
      parameters:
        - name: MerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du marchand connecte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeChargeTokenRequest'
            example:
              amount: 1500
              paymentData: encrypted_card_data_from_viva_js_sdk
              paymentMethodId: 10
      responses:
        '200':
          description: Charge token genere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeChargeTokenResponse'
              example:
                chargeToken: ctok_abc123def456
        '400':
          description: Donnees de paiement invalides
        '401':
          description: Authentification echouee

  /nativecheckout/v2/isv/transactions:
    post:
      tags: [NativeCheckoutIsv]
      summary: Executer une transaction ISV avec charge token
      operationId: createNativeTransaction
      security:
        - BearerAuth: []
      parameters:
        - name: MerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du marchand connecte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTransactionRequest'
            example:
              chargeToken: ctok_abc123def456
              amount: 1500
              isvAmount: 100
              currencyCode: 978
              merchantTrns: session_123
      responses:
        '200':
          description: Transaction executee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTransactionResponse'
              example:
                transactionId: txn-uuid-123
                statusId: F
        '400':
          description: |
            Requete invalide. Causes courantes :
            - `isvAmount > amount`
            - Charge token expire ou invalide
        '401':
          description: Authentification echouee

  # ==================== IsvWebhooks ====================

  /isv/v1/webhooks:
    post:
      tags: [IsvWebhooks]
      summary: Creer un webhook ISV
      operationId: createIsvWebhook
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvWebhookCreate'
            example:
              url: https://app.com/webhooks/viva
              eventType: transaction.payment.created
              description: Notifications de paiement
      responses:
        '200':
          description: Webhook cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvWebhookResponse'
        '400':
          description: Requete invalide
        '401':
          description: Authentification echouee

    get:
      tags: [IsvWebhooks]
      summary: Lister tous les webhooks ISV
      operationId: listIsvWebhooks
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des webhooks ISV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IsvWebhookResponse'
        '401':
          description: Authentification echouee

  /isv/v1/webhooks/{webhookId}:
    put:
      tags: [IsvWebhooks]
      summary: Mettre a jour un webhook ISV
      operationId: updateIsvWebhook
      security:
        - BearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvWebhookUpdate'
            example:
              url: https://app.com/webhooks/viva-v2
              eventType: transaction.refund.created
      responses:
        '200':
          description: Webhook mis a jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvWebhookResponse'
        '404':
          description: Webhook non trouve

    delete:
      tags: [IsvWebhooks]
      summary: Supprimer un webhook ISV
      operationId: deleteIsvWebhook
      security:
        - BearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook supprime
        '404':
          description: Webhook non trouve
