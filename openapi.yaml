openapi: 3.1.0
info:
  title: SDK PHP ISV — Référence
  version: 1.6.0
  description: |
    SDK PHP pour l'API **Viva Wallet ISV Partner** — 10 ressources couvrant : comptes connectés, comptes ISV, ordres ISV avec commission, transactions (capture, récurrent, annulation), terminaux Cloud POS, transferts marketplace, ordres marketplace, Native Checkout ISV, webhooks ISV (CRUD) et parsing (21 événements).

    ## Utilisation du SDK

    ```php
    use QrCommunication\VivaIsv\VivaIsvClient;

    $isv = new VivaIsvClient(
        clientId:       'isv-client-id.apps.vivapayments.com',
        clientSecret:   'isv-client-secret',
        merchantId:     'isv-merchant-uuid',
        apiKey:         'isv-api-key',
        resellerId:     'reseller-uuid',
        resellerApiKey: 'reseller-api-key',
        environment:    'demo',
    );

    // Créer un compte connecté
    $account = $isv->accounts->create('email@example.com', 'https://return.url');

    // Créer un ordre ISV
    $order = $isv->orders->create('merchant-uuid', 1500, isvAmount: 100);

    // Capturer une pré-autorisation
    $isv->transactions->capture('txn-uuid', 'merchant-uuid', amount: 1500);

    // Vente POS
    $session = $isv->terminals->sale(16014231, 100, 10, 'merchant-uuid');
    $result  = $isv->terminals->pollUntilComplete($session['session_id']);
    ```

    ## Authentification

    Le SDK gère **3 modes d'authentification** automatiquement — l'utilisateur fournit 6 credentials au constructeur et n'a plus à s'en soucier.

    | Mode | Credentials | Géré par le SDK pour |
    |------|-------------|---------------------|
    | **ISV OAuth2 (Bearer)** | `clientId` + `clientSecret` | Comptes, ordres ISV, terminaux, transferts, marketplace, native checkout, webhooks ISV |
    | **ISV Basic Auth** | `merchantId` + `apiKey` | Opérations Legacy sur le propre compte ISV |
    | **Composite Basic Auth** | `resellerId` + `resellerApiKey` | Transactions des marchands connectés (capture, récurrent, annulation) |

    Le Composite Basic Auth (`{ResellerID}:{ConnectedMerchantID}` / `{ResellerAPIKey}`) est un format **non documenté** par Viva Wallet, découvert empiriquement lors de la certification ISV.

    ## Montants

    Tous les montants sont en **centimes** (int). Exemple : `1500` = 15,00 EUR.

  contact:
    name: QrCommunication
    email: contact@qrcommunication.com
    url: https://qrcommunication.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: php
    description: "SDK PHP — appels via $isv->resource->method()"

tags:
  - name: ConnectedAccounts
    description: |
      `$isv->accounts` — Gestion des comptes marchands connectés à la plateforme ISV.
      Création, consultation, KYB onboarding, vérification, mise à jour et suppression.
  - name: IsvAccounts
    description: |
      `$isv->isvAccounts` — Comptes ISV via le namespace `/isv/v1/`.
      Création avec branding personnalisé, consultation et listing.
  - name: IsvOrders
    description: |
      `$isv->orders` — Ordres de paiement Smart Checkout pour marchands connectés.
      Création d'ordres avec commission ISV, URL de checkout.
  - name: IsvTransactions
    description: |
      `$isv->transactions` — Opérations sur les transactions des marchands connectés.
      Consultation, listing par date, capture de pré-autorisation, paiement récurrent, annulation/remboursement.
      Utilise le Composite Basic Auth automatiquement.
  - name: EcrTerminals
    description: |
      `$isv->terminals` — Terminaux de paiement Cloud POS ISV.
      Recherche de terminaux, vente POS, sessions, abort et polling.
  - name: Transfers
    description: |
      `$isv->transfers` — Transferts de fonds vers les comptes connectés.
      Envoi et annulation de transferts marketplace.
  - name: MarketplaceOrders
    description: |
      `$isv->marketplace` — Ordres marketplace avec transfert automatique au vendeur.
      Création d'ordres avec distribution automatique et annulation avec reversal.
  - name: NativeCheckoutIsv
    description: |
      `$isv->nativeCheckout` — Paiement natif server-to-server pour marchands connectés.
      Création de charge tokens et exécution de transactions sans redirection Smart Checkout.
  - name: IsvWebhooks
    description: |
      `$isv->isvWebhooks` — CRUD des webhooks ISV.
      Création, listing, mise à jour et suppression d'abonnements webhook.
  - name: Webhooks
    description: |
      `$isv->webhooks` — Vérification et parsing des événements webhook (21 types).
      Réponse de vérification GET, parsing du payload POST, validation des événements.
  - name: IsvMessages
    description: |
      `$isv->messages` — Abonnements webhook au niveau marchand connecté via `/api/messages/config`.

      Utilise le Composite Basic Auth (ResellerID:ConnectedMerchantID / ResellerAPIKey).
      À utiliser pour les événements bancaires per-merchant (768/769/2054) que Viva n'envoie
      pas automatiquement aux webhooks ISV-level.

      **Préférer `$isv->merchantWebhookRegistrar()->registerAll()` en provisioning** (idempotent).

paths:
  # ==================== ConnectedAccounts ====================

  /ConnectedAccounts/create:
    post:
      tags: [ConnectedAccounts]
      operationId: accounts-create
      summary: "$isv->accounts->create()"
      description: |
        Crée un compte marchand connecté à la plateforme ISV.

        ```php
        $account = $isv->accounts->create(
            email: 'merchant@example.com',
            returnUrl: 'https://myapp.com/onboarding/complete',
            partnerName: 'Ma Plateforme',
            logoUrl: 'https://myapp.com/logo.png',
        );

        // Rediriger le marchand vers l'onboarding KYB
        header('Location: ' . $account['invitation']['redirectUrl']);
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectedAccountCreateParams'
      responses:
        '200':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountCreateResponse'
        '400':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/AuthError'

  /ConnectedAccounts/get:
    get:
      tags: [ConnectedAccounts]
      operationId: accounts-get
      summary: "$isv->accounts->get()"
      description: |
        Récupère les détails d'un compte connecté (statut de vérification, merchantId, etc.).

        ```php
        $account = $isv->accounts->get('account-uuid');
        echo $account['verificationStatus']; // 'Verified', 'Pending', etc.
        echo $account['merchantId'];
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du compte connecté
      responses:
        '200':
          description: Détails du compte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountDetails'

  /ConnectedAccounts/list:
    get:
      tags: [ConnectedAccounts]
      operationId: accounts-list
      summary: "$isv->accounts->list()"
      description: |
        Liste tous les comptes marchands connectés à la plateforme ISV (paginé).

        ```php
        $accounts = $isv->accounts->list();
        foreach ($accounts as $account) {
            echo $account['accountId'] . ' — ' . $account['verificationStatus'];
        }
        ```
      responses:
        '200':
          description: Liste paginée des comptes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectedAccountDetails'

  /ConnectedAccounts/isVerified:
    get:
      tags: [ConnectedAccounts]
      operationId: accounts-isVerified
      summary: "$isv->accounts->isVerified()"
      description: |
        Vérifie si un compte connecté a terminé le processus KYB.
        Retourne `true` si le statut est `Verified` ou `Active`.

        ```php
        if ($isv->accounts->isVerified('account-uuid')) {
            // Le marchand peut recevoir des paiements
        }
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statut de vérification
          content:
            application/json:
              schema:
                type: boolean

  /ConnectedAccounts/onboardingUrl:
    get:
      tags: [ConnectedAccounts]
      operationId: accounts-onboardingUrl
      summary: "$isv->accounts->onboardingUrl()"
      description: |
        Récupère l'URL d'onboarding KYB pour un compte connecté.
        Retourne `null` si le compte est déjà vérifié.

        ```php
        $url = $isv->accounts->onboardingUrl('account-uuid');
        if ($url) {
            header('Location: ' . $url);
        }
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: URL d'onboarding ou null
          content:
            application/json:
              schema:
                type: string
                nullable: true

  /ConnectedAccounts/update:
    post:
      tags: [ConnectedAccounts]
      operationId: accounts-update
      summary: "$isv->accounts->update()"
      description: |
        Met à jour les attributs d'un compte connecté.

        ```php
        $isv->accounts->update('account-uuid', [
            'email' => 'new-email@example.com',
        ]);
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Champs à mettre à jour
      responses:
        '200':
          description: Compte mis à jour
          content:
            application/json:
              schema:
                type: object

  /ConnectedAccounts/delete:
    delete:
      tags: [ConnectedAccounts]
      operationId: accounts-delete
      summary: "$isv->accounts->delete()"
      description: |
        Supprime/déconnecte un compte marchand connecté.

        ```php
        $isv->accounts->delete('account-uuid');
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Compte supprimé

  # ==================== IsvAccounts ====================

  /IsvAccounts/create:
    post:
      tags: [IsvAccounts]
      operationId: isvAccounts-create
      summary: "$isv->isvAccounts->create()"
      description: |
        Crée un compte connecté via le namespace ISV `/isv/v1/` avec options de branding.

        ```php
        $account = $isv->isvAccounts->create(
            email: 'merchant@example.com',
            returnUrl: 'https://myapp.com/onboarding/done',
            partnerName: 'Ma Plateforme',
            primaryColor: '#0052FF',
            logoUrl: 'https://myapp.com/logo.png',
        );

        header('Location: ' . $account['invitation']['redirectUrl']);
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvAccountCreateParams'
      responses:
        '200':
          description: Compte ISV créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountCreateResponse'

  /IsvAccounts/get:
    get:
      tags: [IsvAccounts]
      operationId: isvAccounts-get
      summary: "$isv->isvAccounts->get()"
      description: |
        Récupère les détails d'un compte ISV.

        ```php
        $account = $isv->isvAccounts->get('account-uuid');
        ```
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails du compte ISV
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountDetails'

  /IsvAccounts/list:
    get:
      tags: [IsvAccounts]
      operationId: isvAccounts-list
      summary: "$isv->isvAccounts->list()"
      description: |
        Liste tous les comptes ISV connectés.

        ```php
        $accounts = $isv->isvAccounts->list();
        ```
      responses:
        '200':
          description: Liste des comptes ISV
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectedAccountDetails'

  # ==================== IsvOrders ====================

  /IsvOrders/create:
    post:
      tags: [IsvOrders]
      operationId: orders-create
      summary: "$isv->orders->create()"
      description: |
        Crée un ordre de paiement Smart Checkout pour un marchand connecté avec commission ISV.

        ```php
        $order = $isv->orders->create(
            connectedMerchantId: 'merchant-uuid',
            amount: 1500,                    // 15,00 EUR
            isvAmount: 100,                  // 1,00 EUR de commission
            customerDescription: 'Consultation bien-être',
            merchantReference: 'INV-2026-001',
            allowRecurring: true,            // Tokeniser la carte
            preauth: false,
        );

        echo $order['order_code'];     // 1234567890
        echo $order['checkout_url'];   // https://demo.vivapayments.com/web/checkout?ref=1234567890

        // Rediriger le client
        header('Location: ' . $order['checkout_url']);
        ```

        **Règles :**
        - `isvAmount` doit être inférieur ou égal à `amount` (sinon `InvalidArgumentException`)
        - Le marchand connecté utilise sa source de paiement par défaut (pas de `sourceCode`)
        - Les paramètres sont en camelCase (New API)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvOrderCreateParams'
      responses:
        '200':
          description: Ordre créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvOrderCreateResponse'
        '400':
          $ref: '#/components/responses/ApiError'

  /IsvOrders/checkoutUrl:
    get:
      tags: [IsvOrders]
      operationId: orders-checkoutUrl
      summary: "$isv->orders->checkoutUrl()"
      description: |
        Construit l'URL Smart Checkout à partir d'un code d'ordre.

        ```php
        $url = $isv->orders->checkoutUrl(1234567890);
        // => 'https://demo.vivapayments.com/web/checkout?ref=1234567890'
        ```
      parameters:
        - name: orderCode
          in: query
          required: true
          schema:
            type: integer
          description: Code de l'ordre
      responses:
        '200':
          description: URL de checkout
          content:
            application/json:
              schema:
                type: string

  # ==================== IsvTransactions ====================

  /IsvTransactions/get:
    get:
      tags: [IsvTransactions]
      operationId: transactions-get
      summary: "$isv->transactions->get()"
      description: |
        Récupère les détails d'une transaction pour un marchand connecté.
        Utilise automatiquement le Composite Basic Auth.

        ```php
        $txn = $isv->transactions->get('transaction-uuid', 'merchant-uuid');
        echo $txn['Amount'];
        echo $txn['StatusId'];
        ```
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: connectedMerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails de la transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetails'

  /IsvTransactions/listByDate:
    get:
      tags: [IsvTransactions]
      operationId: transactions-listByDate
      summary: "$isv->transactions->listByDate()"
      description: |
        Liste les transactions d'un marchand connecté pour une date donnée.

        ```php
        $transactions = $isv->transactions->listByDate('merchant-uuid', '2026-03-18');
        foreach ($transactions as $txn) {
            echo $txn['TransactionId'] . ' — ' . $txn['Amount'];
        }
        ```
      parameters:
        - name: connectedMerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date au format Y-m-d
      responses:
        '200':
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionDetails'

  /IsvTransactions/capture:
    post:
      tags: [IsvTransactions]
      operationId: transactions-capture
      summary: "$isv->transactions->capture()"
      description: |
        Capture une transaction pré-autorisée sur un marchand connecté.

        ```php
        $result = $isv->transactions->capture(
            transactionId: 'preauth-txn-uuid',
            connectedMerchantId: 'merchant-uuid',
            amount: 1500,
            isvAmount: 100,
        );
        ```

        **Prérequis :** L'option "Allow recurring payments and pre-auth captures via API"
        doit être activée dans Settings > API Access du compte ISV.

        Lance `ApiException` si `ErrorCode !== 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureParams'
      responses:
        '200':
          description: Capture réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResult'
        '400':
          $ref: '#/components/responses/ApiError'

  /IsvTransactions/recurring:
    post:
      tags: [IsvTransactions]
      operationId: transactions-recurring
      summary: "$isv->transactions->recurring()"
      description: |
        Effectue un paiement récurrent sur un marchand connecté à partir d'une transaction initiale tokenisée.

        ```php
        $result = $isv->transactions->recurring(
            initialTransactionId: 'initial-txn-uuid',
            connectedMerchantId: 'merchant-uuid',
            amount: 1500,
            isvAmount: 100,
            sourceCode: 'Default',
        );
        ```

        Lance `ApiException` si `ErrorCode !== 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringParams'
      responses:
        '200':
          description: Paiement récurrent réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResult'
        '400':
          $ref: '#/components/responses/ApiError'

  /IsvTransactions/cancel:
    delete:
      tags: [IsvTransactions]
      operationId: transactions-cancel
      summary: "$isv->transactions->cancel()"
      description: |
        Annule ou rembourse une transaction sur un marchand connecté.

        ```php
        // Remboursement total
        $isv->transactions->cancel('txn-uuid', 'merchant-uuid');

        // Remboursement partiel (5,00 EUR)
        $isv->transactions->cancel('txn-uuid', 'merchant-uuid', amount: 500);

        // Avec source code
        $isv->transactions->cancel('txn-uuid', 'merchant-uuid', amount: 500, sourceCode: 'Default');
        ```
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: connectedMerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: amount
          in: query
          required: false
          schema:
            type: integer
            nullable: true
          description: Montant en centimes (null = remboursement total)
        - name: sourceCode
          in: query
          required: false
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Transaction annulée/remboursée
          content:
            application/json:
              schema:
                type: object

  # ==================== EcrTerminals ====================

  /EcrTerminals/search:
    post:
      tags: [EcrTerminals]
      operationId: terminals-search
      summary: "$isv->terminals->search()"
      description: |
        Recherche les terminaux POS disponibles pour un marchand.

        ```php
        $terminals = $isv->terminals->search(merchantId: 'merchant-uuid');
        foreach ($terminals as $terminal) {
            echo $terminal['terminalId'] . ' — ' . $terminal['name'];
        }
        ```
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalSearchParams'
      responses:
        '200':
          description: Liste des terminaux
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TerminalInfo'

  /EcrTerminals/sale:
    post:
      tags: [EcrTerminals]
      operationId: terminals-sale
      summary: "$isv->terminals->sale()"
      description: |
        Crée une vente ISV sur un terminal POS Cloud.

        ```php
        $session = $isv->terminals->sale(
            terminalId: 16014231,
            amount: 1500,
            isvAmount: 100,
            terminalMerchantId: 'merchant-uuid',
            cashRegisterId: 'PratiConnect-CR1',
            merchantReference: 'INV-2026-001',
        );

        echo $session['session_id']; // UUID de la session

        // Polling jusqu'au résultat
        $result = $isv->terminals->pollUntilComplete($session['session_id']);
        ```

        **Notes :**
        - La pré-autorisation n'est PAS supportée via Cloud Terminal ISV (utiliser Smart Checkout)
        - Le `sessionId` est auto-généré si non fourni
        - `isvDetails` est construit automatiquement par le SDK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalSaleParams'
      responses:
        '200':
          description: Vente initiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSaleResponse'

  /EcrTerminals/getSession:
    get:
      tags: [EcrTerminals]
      operationId: terminals-getSession
      summary: "$isv->terminals->getSession()"
      description: |
        Récupère l'état d'une session POS.

        ```php
        $session = $isv->terminals->getSession('session-uuid');
        echo $session['eventId'];        // 0 = succès, 1100 = en cours
        echo $session['transactionId'];  // UUID de la transaction (si succès)
        ```
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: État de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetails'

  /EcrTerminals/listSessions:
    get:
      tags: [EcrTerminals]
      operationId: terminals-listSessions
      summary: "$isv->terminals->listSessions()"
      description: |
        Liste les sessions POS pour une date donnée.

        ```php
        $sessions = $isv->terminals->listSessions('2026-03-18');
        ```
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionDetails'

  /EcrTerminals/abort:
    get:
      tags: [EcrTerminals]
      operationId: terminals-abort
      summary: "$isv->terminals->abort()"
      description: |
        Annule une session POS active.

        **Attention :** Utilise GET (pas DELETE) — c'est une particularité de l'API Viva.

        ```php
        $isv->terminals->abort('session-uuid', 'PratiConnect-CR1');
        ```
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: cashRegisterId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session annulée

  /EcrTerminals/pollUntilComplete:
    get:
      tags: [EcrTerminals]
      operationId: terminals-pollUntilComplete
      summary: "$isv->terminals->pollUntilComplete()"
      description: |
        Interroge une session en boucle jusqu'à un état terminal ou timeout.

        Le polling s'arrête dès que `eventId !== 1100` (IN_PROGRESS).

        ```php
        $result = $isv->terminals->pollUntilComplete(
            sessionId: 'session-uuid',
            timeoutSeconds: 120,    // défaut: 120s
            intervalMs: 3000,       // défaut: 3000ms
        );

        // Utiliser l'enum EcrEventId pour interpréter le résultat
        $eventId = EcrEventId::tryFrom($result['eventId']);
        if ($eventId?->isSuccessful()) {
            echo 'Transaction réussie : ' . $result['transactionId'];
        } else {
            echo 'Échec : ' . $eventId?->label();
        }
        ```
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: timeoutSeconds
          in: query
          schema:
            type: integer
            default: 120
        - name: intervalMs
          in: query
          schema:
            type: integer
            default: 3000
      responses:
        '200':
          description: État final de la session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetails'

  # ==================== Transfers ====================

  /Transfers/send:
    post:
      tags: [Transfers]
      operationId: transfers-send
      summary: "$isv->transfers->send()"
      description: |
        Envoie des fonds vers un compte connecté (vendeur).

        ```php
        $transfer = $isv->transfers->send(
            targetAccountId: 'seller-account-uuid',
            amount: 1000,                           // 10,00 EUR
            sourceWalletId: 'platform-wallet-uuid',  // optionnel
            transactionId: 'txn-uuid',               // lier à une transaction
            description: 'Commission mars 2026',
        );

        echo $transfer['transferId'];
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferSendParams'
      responses:
        '200':
          description: Transfert effectué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'

  /Transfers/reverse:
    post:
      tags: [Transfers]
      operationId: transfers-reverse
      summary: "$isv->transfers->reverse()"
      description: |
        Annule un transfert vers un compte connecté.

        ```php
        // Annulation totale
        $isv->transfers->reverse('transfer-uuid');

        // Annulation partielle (5,00 EUR)
        $isv->transfers->reverse('transfer-uuid', amount: 500);
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferReverseParams'
      responses:
        '200':
          description: Transfert annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'

  # ==================== MarketplaceOrders ====================

  /MarketplaceOrders/create:
    post:
      tags: [MarketplaceOrders]
      operationId: marketplace-create
      summary: "$isv->marketplace->create()"
      description: |
        Crée un ordre marketplace avec transfert automatique vers le vendeur.

        ```php
        $order = $isv->marketplace->create(
            amount: 1500,                    // 15,00 EUR total
            sellerAccountId: 'seller-uuid',
            sellerAmount: 1200,              // 12,00 EUR au vendeur
            customerDescription: 'Achat marketplace',
            merchantReference: 'MKT-001',
        );

        echo $order['order_code'];
        echo $order['checkout_url'];
        echo $order['platform_fee'];  // 300 (3,00 EUR)
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceOrderCreateParams'
      responses:
        '200':
          description: Ordre marketplace créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceOrderCreateResponse'

  /MarketplaceOrders/cancel:
    delete:
      tags: [MarketplaceOrders]
      operationId: marketplace-cancel
      summary: "$isv->marketplace->cancel()"
      description: |
        Annule/rembourse une transaction marketplace avec gestion automatique des transferts.

        ```php
        // Remboursement total avec reversal des transferts
        $isv->marketplace->cancel('txn-uuid');

        // Remboursement partiel sans rembourser la commission plateforme
        $isv->marketplace->cancel(
            transactionId: 'txn-uuid',
            amount: 500,
            reverseTransfers: true,
            refundPlatformFee: false,
        );
        ```
      parameters:
        - name: transactionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: amount
          in: query
          schema:
            type: integer
            nullable: true
        - name: reverseTransfers
          in: query
          schema:
            type: boolean
            default: true
        - name: refundPlatformFee
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Transaction annulée

  # ==================== NativeCheckoutIsv ====================

  /NativeCheckoutIsv/createChargeToken:
    post:
      tags: [NativeCheckoutIsv]
      operationId: nativeCheckout-createChargeToken
      summary: "$isv->nativeCheckout->createChargeToken()"
      description: |
        Génère un charge token pour un paiement natif ISV (server-to-server).

        **Flux :**
        1. Le client collecte les données carte via le JS SDK Viva et obtient `paymentData` (chiffré)
        2. Votre serveur crée un charge token via cette méthode
        3. Votre serveur exécute la transaction via `createTransaction()`

        ```php
        $token = $isv->nativeCheckout->createChargeToken(
            connectedMerchantId: 'merchant-uuid',
            amount: 1500,
            paymentData: $encryptedCardData,  // Du JS SDK Viva
            paymentMethodId: 10,               // 10 = carte (défaut)
        );

        echo $token['chargeToken'];
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeTokenParams'
      responses:
        '200':
          description: Charge token créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeTokenResponse'

  /NativeCheckoutIsv/createTransaction:
    post:
      tags: [NativeCheckoutIsv]
      operationId: nativeCheckout-createTransaction
      summary: "$isv->nativeCheckout->createTransaction()"
      description: |
        Exécute une transaction ISV avec un charge token.

        ```php
        $txn = $isv->nativeCheckout->createTransaction(
            connectedMerchantId: 'merchant-uuid',
            chargeToken: $token['chargeToken'],
            amount: 1500,
            isvAmount: 100,
            merchantTrns: 'INV-2026-001',
            customerTrns: 'Consultation bien-être',
            preauth: false,
        );

        echo $txn['transactionId'];
        echo $txn['statusId'];
        ```

        **Règle :** `isvAmount` doit être inférieur ou égal à `amount` (sinon `InvalidArgumentException`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeTransactionParams'
      responses:
        '200':
          description: Transaction exécutée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeTransactionResponse'

  # ==================== IsvWebhooks ====================

  /IsvWebhooks/create:
    post:
      tags: [IsvWebhooks]
      operationId: isvWebhooks-create
      summary: "$isv->isvWebhooks->create()"
      description: |
        Crée un abonnement webhook pour les événements ISV.

        ```php
        $webhook = $isv->isvWebhooks->create(
            url: 'https://myapp.com/webhooks/viva',
            eventType: 'transaction.payment.created',
            description: 'Notifications de paiement',
        );

        echo $webhook['webhookId'];
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateParams'
      responses:
        '200':
          description: Webhook créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDetails'

  /IsvWebhooks/list:
    get:
      tags: [IsvWebhooks]
      operationId: isvWebhooks-list
      summary: "$isv->isvWebhooks->list()"
      description: |
        Liste tous les webhooks ISV configurés.

        ```php
        $webhooks = $isv->isvWebhooks->list();
        foreach ($webhooks as $wh) {
            echo $wh['webhookId'] . ' → ' . $wh['url'];
        }
        ```
      responses:
        '200':
          description: Liste des webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDetails'

  /IsvWebhooks/update:
    put:
      tags: [IsvWebhooks]
      operationId: isvWebhooks-update
      summary: "$isv->isvWebhooks->update()"
      description: |
        Met à jour un webhook ISV (URL et/ou type d'événement).

        ```php
        $isv->isvWebhooks->update(
            webhookId: 'webhook-uuid',
            url: 'https://myapp.com/webhooks/viva-v2',
            eventType: 'transaction.refund.created',
        );
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdateParams'
      responses:
        '200':
          description: Webhook mis à jour

  /IsvWebhooks/delete:
    delete:
      tags: [IsvWebhooks]
      operationId: isvWebhooks-delete
      summary: "$isv->isvWebhooks->delete()"
      description: |
        Supprime un webhook ISV.

        ```php
        $isv->isvWebhooks->delete('webhook-uuid');
        ```
      parameters:
        - name: webhookId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook supprimé

  # ==================== Webhooks ====================

  /Webhooks/verificationResponse:
    get:
      tags: [Webhooks]
      operationId: webhooks-verificationResponse
      summary: "$isv->webhooks->verificationResponse()"
      description: |
        Génère la réponse JSON pour la requête GET de vérification webhook de Viva Wallet.

        Quand Viva Wallet configure un webhook, il envoie un GET avec un paramètre de vérification.
        Votre endpoint doit répondre avec ce JSON.

        ```php
        // Dans votre controller webhook (GET)
        $verificationKey = config('services.viva.verification_key');

        return response()->json(
            $isv->webhooks->verificationResponse($verificationKey)
        );
        // => {"StatusCode": 0, "Key": "votre-clé"}
        ```
      parameters:
        - name: verificationKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Réponse de vérification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookVerificationResponse'

  /Webhooks/parse:
    post:
      tags: [Webhooks]
      operationId: webhooks-parse
      summary: "$isv->webhooks->parse()"
      description: |
        Parse le payload POST d'un webhook Viva Wallet.
        Résout automatiquement le `EventTypeId` vers un nom lisible parmi les 21 types connus.

        ```php
        // Dans votre controller webhook (POST)
        $rawBody = file_get_contents('php://input');
        $event = $isv->webhooks->parse($rawBody);

        echo $event['event_type'];     // 'transaction.payment.created'
        echo $event['event_type_id'];  // 1796
        $data = $event['event_data'];  // Données de l'événement

        switch ($event['event_type']) {
            case 'transaction.payment.created':
                // Traiter le paiement
                break;
            case 'transaction.refund.created':
                // Traiter le remboursement
                break;
        }
        ```

        Lance `InvalidArgumentException` si le payload JSON est invalide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: Body brut de la requête POST webhook
      responses:
        '200':
          description: Événement parsé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookParsedEvent'

  /Webhooks/isKnownEvent:
    get:
      tags: [Webhooks]
      operationId: webhooks-isKnownEvent
      summary: "Webhooks::isKnownEvent()"
      description: |
        Vérifie si un `EventTypeId` correspond à un événement connu (méthode statique).

        ```php
        use QrCommunication\VivaIsv\Resources\Webhooks;

        if (Webhooks::isKnownEvent(1796)) {
            echo 'Événement reconnu';
        }
        ```
      parameters:
        - name: eventTypeId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Résultat de la vérification
          content:
            application/json:
              schema:
                type: boolean

  # ==================== IsvMessages ====================

  /IsvMessages/register:
    post:
      tags: [IsvMessages]
      operationId: messages-register
      summary: "$isv->messages->register()"
      description: |
        Enregistre un abonnement webhook au niveau marchand connecté.

        Utilise le Composite Basic Auth (`ResellerID:ConnectedMerchantID` / `ResellerAPIKey`).
        Endpoint Legacy : `/api/messages/config` (PascalCase).

        **Attention** : HTTP 400 si le même URL + EventTypeId est déjà enregistré.
        Pour une registration idempotente, utiliser `merchantWebhookRegistrar()->registerAll()`.

        ```php
        // Bas-niveau — lève ApiException sur doublon
        $isv->messages->register('merchant-uuid', 768, 'https://app.example.com/api/webhooks/viva');

        // Haut-niveau — idempotent, gère le doublon silencieusement
        $results = $isv->merchantWebhookRegistrar()->registerAll(
            connectedMerchantId: 'merchant-uuid',
            callbackUrl: 'https://app.example.com/api/webhooks/viva',
        );
        foreach ($results as $r) {
            echo "Event {$r['event_id']} : {$r['status']}\n";
            // status: 'created' | 'already_exists' | 'failed'
        }
        ```
      security:
        - compositeBasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsvMessageRegisterParams'
      responses:
        '200':
          description: Abonnement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsvMessageDetails'
        '400':
          description: Doublon (même URL + EventTypeId) ou paramètres invalides
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/AuthError'

  /IsvMessages/list:
    get:
      tags: [IsvMessages]
      operationId: messages-list
      summary: "$isv->messages->list()"
      description: |
        Liste tous les abonnements webhook d'un marchand connecté.

        ```php
        $subscriptions = $isv->messages->list('merchant-uuid');
        foreach ($subscriptions as $sub) {
            echo $sub['MessageId'] . ' — EventTypeId: ' . $sub['EventTypeId'];
        }
        ```
      security:
        - compositeBasicAuth: []
      parameters:
        - name: connectedMerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du marchand connecté
      responses:
        '200':
          description: Liste des abonnements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IsvMessageDetails'

  /IsvMessages/delete:
    delete:
      tags: [IsvMessages]
      operationId: messages-delete
      summary: "$isv->messages->delete()"
      description: |
        Supprime un abonnement webhook par son MessageId.

        ```php
        $isv->messages->delete('merchant-uuid', 'message-uuid');
        ```
      security:
        - compositeBasicAuth: []
      parameters:
        - name: connectedMerchantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: messageId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID du message/abonnement à supprimer
      responses:
        '200':
          description: Abonnement supprimé
        '404':
          $ref: '#/components/responses/ApiError'

components:
  securitySchemes:
    compositeBasicAuth:
      type: http
      scheme: basic
      description: |
        Composite Basic Auth (non documenté par Viva Wallet, découvert empiriquement).

        Username: `{ResellerID}:{ConnectedMerchantID}` (deux UUIDs séparés par `:`)
        Password: `{ResellerAPIKey}`

        Le SDK construit ce header automatiquement via `IsvConfig::compositeUsername()`.
  responses:
    ApiError:
      description: Erreur API
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    AuthError:
      description: Erreur d'authentification
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "ISV OAuth2 authentication failed"

  schemas:
    # ==================== ConnectedAccounts ====================

    ConnectedAccountCreateParams:
      type: object
      required: [email, returnUrl]
      properties:
        email:
          type: string
          format: email
          description: Email du marchand
          example: "merchant@example.com"
        returnUrl:
          type: string
          format: uri
          description: URL de redirection après onboarding KYB
          example: "https://myapp.com/onboarding/complete"
        partnerName:
          type: string
          nullable: true
          description: Nom de la plateforme ISV (affiché dans le dashboard Viva)
          example: "Ma Plateforme"
        logoUrl:
          type: string
          format: uri
          nullable: true
          description: Logo de la plateforme ISV
          example: "https://myapp.com/logo.png"

    ConnectedAccountCreateResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
          description: UUID du compte créé
        invitation:
          type: object
          properties:
            redirectUrl:
              type: string
              format: uri
              description: URL d'onboarding KYB

    ConnectedAccountDetails:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        verificationStatus:
          type: string
          enum: [Pending, Verified, Active, Rejected]
        invitation:
          type: object
          properties:
            redirectUrl:
              type: string
              format: uri

    # ==================== IsvAccounts ====================

    IsvAccountCreateParams:
      type: object
      required: [email, returnUrl]
      properties:
        email:
          type: string
          format: email
          example: "merchant@example.com"
        returnUrl:
          type: string
          format: uri
          example: "https://myapp.com/onboarding/done"
        partnerName:
          type: string
          nullable: true
          description: Nom de la plateforme ISV
        primaryColor:
          type: string
          nullable: true
          description: Couleur hex pour le branding onboarding
          example: "#0052FF"
        logoUrl:
          type: string
          format: uri
          nullable: true

    # ==================== IsvOrders ====================

    IsvOrderCreateParams:
      type: object
      required: [connectedMerchantId, amount]
      properties:
        connectedMerchantId:
          type: string
          format: uuid
          description: UUID du marchand connecté
        amount:
          type: integer
          description: Montant total en centimes
          example: 1500
        isvAmount:
          type: integer
          default: 0
          description: Commission ISV en centimes (doit être <= amount)
          example: 100
        customerDescription:
          type: string
          nullable: true
          description: Description affichée dans le checkout
          example: "Consultation bien-être"
        merchantReference:
          type: string
          nullable: true
          description: Référence interne
          example: "INV-2026-001"
        allowRecurring:
          type: boolean
          default: false
          description: Tokeniser la carte pour les paiements récurrents
        preauth:
          type: boolean
          default: false
          description: Pré-autorisation uniquement (pas de capture)

    IsvOrderCreateResponse:
      type: object
      properties:
        order_code:
          type: integer
          description: Code de l'ordre Viva
          example: 1234567890
        checkout_url:
          type: string
          format: uri
          description: URL Smart Checkout complète
          example: "https://demo.vivapayments.com/web/checkout?ref=1234567890"

    # ==================== IsvTransactions ====================

    TransactionDetails:
      type: object
      properties:
        TransactionId:
          type: string
          format: uuid
        Amount:
          type: number
        StatusId:
          type: string
        MerchantTrns:
          type: string
        CustomerTrns:
          type: string
        ErrorCode:
          type: integer
        ErrorText:
          type: string

    CaptureParams:
      type: object
      required: [transactionId, connectedMerchantId, amount]
      properties:
        transactionId:
          type: string
          format: uuid
          description: UUID de la transaction pré-autorisée
        connectedMerchantId:
          type: string
          format: uuid
          description: UUID du marchand connecté
        amount:
          type: integer
          description: Montant en centimes à capturer
          example: 1500
        isvAmount:
          type: integer
          nullable: true
          description: Commission ISV en centimes
          example: 100

    RecurringParams:
      type: object
      required: [initialTransactionId, connectedMerchantId, amount]
      properties:
        initialTransactionId:
          type: string
          format: uuid
          description: UUID de la transaction initiale (token carte)
        connectedMerchantId:
          type: string
          format: uuid
          description: UUID du marchand connecté
        amount:
          type: integer
          description: Montant en centimes
          example: 1500
        isvAmount:
          type: integer
          nullable: true
          description: Commission ISV en centimes
        sourceCode:
          type: string
          nullable: true
          description: Code de la source de paiement

    TransactionResult:
      type: object
      properties:
        ErrorCode:
          type: integer
          description: "0 = succès"
          example: 0
        ErrorText:
          type: string
        StatusId:
          type: string
        TransactionId:
          type: string
          format: uuid

    # ==================== EcrTerminals ====================

    TerminalSearchParams:
      type: object
      properties:
        merchantId:
          type: string
          format: uuid
          nullable: true
          description: Filtrer par marchand
        statusId:
          type: integer
          nullable: true
          description: Filtrer par statut
        sourceCode:
          type: string
          nullable: true

    TerminalInfo:
      type: object
      properties:
        terminalId:
          type: integer
          example: 16014231
        name:
          type: string
        merchantId:
          type: string
          format: uuid
        statusId:
          type: integer

    TerminalSaleParams:
      type: object
      required: [terminalId, amount, isvAmount, terminalMerchantId]
      properties:
        terminalId:
          type: integer
          description: TID du terminal
          example: 16014231
        amount:
          type: integer
          description: Montant en centimes
          example: 1500
        isvAmount:
          type: integer
          description: Commission ISV en centimes
          example: 100
        terminalMerchantId:
          type: string
          format: uuid
          description: UUID du marchand propriétaire du terminal
        cashRegisterId:
          type: string
          default: "SDK-CR1"
          description: Identifiant de la caisse enregistreuse
        merchantReference:
          type: string
          nullable: true
          description: Référence interne
        currencyCode:
          type: integer
          default: 978
          description: Code devise ISO 4217 (978 = EUR)
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: UUID de session (auto-généré si null)

    TerminalSaleResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        success:
          type: boolean

    SessionDetails:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        eventId:
          type: integer
          description: "Voir enum EcrEventId (0=succès, 1100=en cours, etc.)"
        transactionId:
          type: string
          format: uuid
          nullable: true
        transactionEventId:
          type: integer
          nullable: true
          description: "Code de déclin — voir enum TransactionEventId"
        success:
          type: boolean
        message:
          type: string
          nullable: true

    # ==================== Transfers ====================

    TransferSendParams:
      type: object
      required: [targetAccountId, amount]
      properties:
        targetAccountId:
          type: string
          format: uuid
          description: UUID du compte connecté destinataire
        amount:
          type: integer
          description: Montant en centimes
          example: 1000
        sourceWalletId:
          type: string
          format: uuid
          nullable: true
          description: UUID du portefeuille source (plateforme)
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: Lier le transfert à une transaction existante
        description:
          type: string
          nullable: true
          description: Description du transfert
          example: "Commission mars 2026"

    TransferReverseParams:
      type: object
      required: [transferId]
      properties:
        transferId:
          type: string
          format: uuid
